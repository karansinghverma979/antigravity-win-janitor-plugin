name: 💡 Feature Request
description: Propose a new capability, rule candidate, or telemetry governor feature
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: Proposed Feature or Rule Candidate
      description: What telemetry service, memory-leak host, or performance diagnostic would you like to add?
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale & Workstation Benefit
      description: Why does this improve developer workstation latency or eliminate system bloat?
    validations:
      required: true
